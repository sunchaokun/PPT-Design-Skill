name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install pptx-designer python-pptx Pillow

      - name: Validate metadata and Python sources
        run: |
          python -c "import json; d=json.load(open('skill.json', encoding='utf-8')); assert d['name']=='ppt-design-skill'; assert d['version']=='1.2'"
          python -m py_compile install.py installer/install.py skill/scripts/check_runtime.py skill/scripts/inspect_pptx.py
          python -m py_compile evals/001-chinese-enterprise-strategy/build.py evals/002-couture-editorial/build.py evals/003-scientific-research/build.py

      - name: Validate installer and runtime
        run: |
          python installer/install.py --check
