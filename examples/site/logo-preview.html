<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logo 方案预览 · PPT Design Skill</title><link rel="stylesheet" href="styles.css"><style>.logo-preview{max-width:1100px;margin:auto;padding:80px 24px}.logo-preview h1{font:400 clamp(42px,7vw,82px)/.95 Georgia,serif;letter-spacing:-.06em;margin:24px 0 14px}.logo-preview>p{color:var(--muted);max-width:520px}.logo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:55px}.logo-option{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--text)}.logo-option img{display:block;width:100%;border-radius:9px}.logo-option h2{font-size:16px;margin:18px 0 7px}.logo-option p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}@media(max-width:700px){.logo-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PPT Design Skill</span></a><a class="back-link" href="index.html">返回案例画廊 →</a></header><main class="logo-preview"><span class="eyebrow">BRAND MARK / 03 DIRECTIONS</span><h1>Logo 方案预览</h1><p>三个方向都围绕原生可编辑、页面结构和设计系统展开。先确定符号，再制作最终品牌资产。</p><section class="logo-grid"><article class="logo-option"><img src="assets/brand/logo-frame-edit.svg" alt="页面编辑标记"><h2>01 / 页面编辑</h2><p>最直接表达 PowerPoint 页面与编辑节点，适合产品图标和 favicon。</p></article><article class="logo-option"><img src="assets/brand/logo-grid-mark.svg" alt="网格标记"><h2>02 / 网格系统</h2><p>强调结构、精度和设计系统，适合技术型、专业型品牌表达。</p></article><article class="logo-option"><img src="assets/brand/logo-folded-native.svg" alt="原生层级标记"><h2>03 / 原生层级</h2><p>通过页面层级和锚点表达内容、版式与可编辑对象的组合关系。</p></article></section></main></body></html>
